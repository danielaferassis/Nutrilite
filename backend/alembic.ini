# Configuração do Alembic (migrations).
# A URL do banco vem de app.config (DATABASE_URL) e os logs usam app.logger,
# ambos configurados em migrations/env.py.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# Nome dos arquivos: 20261015_1230_<rev>_<descricao>.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
